[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veo3-logo-remover"
version = "0.1.0"
description = "PyQt6 desktop app to remove the Flow Veo3 logo/watermark from videos."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.6",
    "opencv-python-headless>=4.8",
    "numpy>=1.24",
]

[project.scripts]
veo3-logo-remover = "veo3_logo_remover.app:main"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[tool.setuptools]
packages = ["veo3_logo_remover"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
